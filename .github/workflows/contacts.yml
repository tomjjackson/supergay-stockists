name: Stockist contacts (OpenStreetMap)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: write
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -u tools/osm_contacts.py
        timeout-minutes: 320
        continue-on-error: true
      - run: python -u tools/site_phones.py
        if: always()
        timeout-minutes: 20
        continue-on-error: true
      - run: python -u tools/merge_contacts.py
        if: always()
      - if: always()
        run: |
          git config user.name "supergay-bot"
          git config user.email "bot@users.noreply.github.com"
          git add contacts.json stockists.json
          git diff --cached --quiet || (git commit -m "Weekly stockist contacts from OpenStreetMap" && git pull --rebase && git push)
