name: Stockist contacts (OpenStreetMap)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: write
jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python tools/osm_contacts.py
      - run: |
          git config user.name "supergay-bot"
          git config user.email "bot@users.noreply.github.com"
          git add contacts.json
          git diff --cached --quiet || (git commit -m "Weekly stockist contacts from OpenStreetMap" && git pull --rebase && git push)
