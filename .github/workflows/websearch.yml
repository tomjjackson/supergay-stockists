name: Stockist phones from store websites
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -u tools/web_sitephones.py
        timeout-minutes: 60
        continue-on-error: true
      - if: always()
        run: |
          git config user.name "supergay-bot"
          git config user.email "bot@users.noreply.github.com"
          git add tools/web_contacts.json
          git diff --cached --quiet || (git commit -m "Stockist phones from web search" && git pull --rebase && git push)
