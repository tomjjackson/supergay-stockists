name: Stockist contacts (web search)
on:
  workflow_dispatch:
    inputs:
      limit: { default: '2000' }
      state: { default: '' }
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -u tools/web_search.py "${{ inputs.limit }}" "${{ inputs.state }}"
        timeout-minutes: 280
        continue-on-error: true
      - if: always()
        run: |
          git config user.name "supergay-bot"
          git config user.email "bot@users.noreply.github.com"
          git add tools/web_contacts.json
          git diff --cached --quiet || (git commit -m "Stockist phones from web search" && git pull --rebase && git push)
